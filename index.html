<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Finger Picker</title>
    <meta name="description" content="多人聚會派對必備的指尖隨機抽籤與分組工具">

    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Google Fonts: LINE Seed JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        /* --- CSS Reset & Base --- */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #111;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            font-family: 'LINE Seed JP', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* --- Layers --- */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: block;
        }

        #ui-layer {
            position: absolute;
            bottom: max(30px, env(safe-area-inset-bottom, 30px));
            left: 0;
            width: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
            transform: translateY(0);
            opacity: 1;
        }

        /* --- UI Components (毛玻璃黑膠囊面板) --- */
        .control-panel {
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 50px;
            display: flex;
            gap: 20px;
            align-items: center;
            pointer-events: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
        }

        .mode-switch-container {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 999px;
            padding: 4px;
        }

        .mode-btn {
            color: #888;
            font-weight: 600;
            font-size: 15px;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .mode-btn.active {
            background-color: #333;
            color: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .counter-control {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            font-weight: bold;
            background: #222;
            padding: 4px 6px;
            padding-right: 12px;
            border-radius: 24px;
        }

        .counter-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #444;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            font-size: 18px;
            transition: background 0.1s, transform 0.1s;
        }

        .counter-btn:active:not(.disabled) {
            background: #666;
            transform: scale(0.95);
        }

        .counter-btn.disabled {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }

        .counter-text {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .counter-num {
            font-size: 18px;
        }

        .counter-unit {
            font-size: 12px;
            color: #999;
        }

        .instructions {
            color: #666;
            font-size: 13px;
            margin-top: 12px;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }

        /* 將 UI 移出螢幕下方 */
        .hidden-ui {
            transform: translateY(200%) !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>
</head>

<body>

    <canvas id="canvas"></canvas>

    <div id="ui-layer">
        <div class="control-panel">
            <!-- Mode Switch -->
            <div class="mode-switch-container">
                <div id="mode-pick" class="mode-btn active">抽籤</div>
                <div id="mode-group" class="mode-btn">分組</div>
            </div>

            <!-- Quantity Control -->
            <div class="counter-control">
                <div id="counter-minus" class="counter-btn">-</div>
                <div class="counter-text">
                    <span id="target-count" class="counter-num">1</span>
                    <span id="target-label" class="counter-unit">人</span>
                </div>
                <div id="counter-plus" class="counter-btn">+</div>
            </div>
        </div>
        <div class="instructions" id="instructions-text">兩指以上開始</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const uiLayer = document.getElementById('ui-layer');
        const instructionsText = document.getElementById('instructions-text');

        let width = window.innerWidth;
        let height = window.innerHeight;
        let dpr = 1;

        // Settings
        let mode = 'pick';
        let targetValue = 1;

        // Game Logic
        let gameState = 'WAITING'; // WAITING, COUNTDOWN, RESULT

        // Timers & Duration Constants
        const LOCK_TIME = 800; // 單指就位鎖定時長 (ms)
        const TOTAL_COUNTDOWN_TIME = 1800; // 集體倒數時長 (ms)

        let globalCountdownStart = 0;
        let globalProgress = 0;

        // Result Animation & Timers
        let resultStartTime = 0;
        let resetTimer = null;

        // Exit Animation State
        let isGameExiting = false;
        let exitStartTime = 0;
        const EXIT_ANIMATION_DURATION = 500;
        const LOSER_SHRINK_DURATION = 400;
        const LIFT_SHRINK_DURATION = 220; // 手指鬆開縮小消失的動畫時長 (ms)
        const SPOTLIGHT_EXIT_DURATION = 450; // 聚光燈放大退出動畫時長 (ms)
        const RESULT_RESET_DELAY = 1200; // 鬆手後停留 1.5 秒再退出 (ms)

        // Spotlight State (僅限單人中籤模式)
        let spotlightState = {
            active: false,
            x: 0,
            y: 0,
            color: '#FF00FF',
            radius: 38,
            isExiting: false,
            exitStartTime: 0
        };

        const fingers = new Map();

        // 10 Distinct Neon Colors (舊版經典色盤)
        const PRESET_COLORS = [
            '#FF00FF', // Magenta
            '#00FFFF', // Cyan
            '#39FF14', // Neon Green
            '#FFFF00', // Yellow
            '#FF3131', // Neon Red
            '#9D00FF', // Electric Purple
            '#0066FF', // Bright Blue
            '#FF8800', // Neon Orange
            '#00FF99', // Turquoise
            '#FE019A'  // Hot Pink
        ];

        // Linear Interpolation for Colors
        function lerpColor(a, b, amount) {
            const ah = parseInt(a.replace(/#/g, ''), 16),
                ar = ah >> 16, ag = ah >> 8 & 0xff, ab = ah & 0xff,
                bh = parseInt(b.replace(/#/g, ''), 16),
                br = bh >> 16, bg = bh >> 8 & 0xff, bb = bh & 0xff,
                rr = ar + amount * (br - ar),
                rg = ag + amount * (bg - ag),
                rb = ab + amount * (bb - ab);
            return '#' + ((1 << 24) + (rr << 16) + (rg << 8) + rb | 0).toString(16).slice(1);
        }

        // Convert HSL to Hex
        function hslToHex(h, s, l) {
            l /= 100;
            const a = s * Math.min(l, 1 - l) / 100;
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`;
        }

        // Easing functions
        function easeOutCubic(t) { return (--t) * t * t + 1; }
        function easeInCubic(t) { return t * t * t; }

        // Fisher-Yates (Knuth) 洗牌演算法（完全隨機無偏差）
        function shuffle(array) {
            const copy = [...array];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const temp = copy[i];
                copy[i] = copy[j];
                copy[j] = temp;
            }
            return copy;
        }

        // 安全震動輔助
        function triggerVibrate(pattern) {
            if ('vibrate' in navigator) {
                try {
                    navigator.vibrate(pattern);
                } catch (_) { }
            }
        }

        // --- Finger Entity ---
        class Finger {
            constructor(id, x, y) {
                this.id = id;
                this.x = x;
                this.y = y;
                this.originalColor = this.assignUniqueColor();
                this.currentColor = this.originalColor;

                this.radius = 0;
                this.targetRadius = 38;

                this.startTime = Date.now();
                this.isReady = false;
                this.lockInProgress = 0;

                this.isWinner = false;
                this.targetGroupColor = null;
                this.groupIndex = -1;
                this.isLoser = false;

                this.isLifted = false;
                this.isLifting = false;
                this.liftStartTime = 0;
                this.liftStartRadius = 0;
                this.isDead = false;
            }

            startLift() {
                if (this.isLifting || this.isDead) return;
                this.isLifted = true;
                this.isLifting = true;
                this.liftStartTime = Date.now();
                this.liftStartRadius = Math.max(this.radius, 10);
            }

            assignUniqueColor() {
                const usedColors = new Set();
                for (const f of fingers.values()) {
                    usedColors.add(f.originalColor);
                }
                const available = PRESET_COLORS.filter(c => !usedColors.has(c));
                if (available.length > 0) {
                    return available[Math.floor(Math.random() * available.length)];
                } else {
                    return PRESET_COLORS[Math.floor(Math.random() * PRESET_COLORS.length)];
                }
            }

            update() {
                if (this.isLifting) {
                    const elapsed = Date.now() - this.liftStartTime;
                    const progress = Math.min(elapsed / LIFT_SHRINK_DURATION, 1);
                    this.radius = this.liftStartRadius * (1 - easeInCubic(progress));
                    if (progress >= 1 || this.radius <= 0.5) {
                        this.radius = 0;
                        this.isDead = true;
                    }
                    return;
                }

                if (this.radius < this.targetRadius) {
                    this.radius += (this.targetRadius - this.radius) * 0.2;
                }

                if (gameState === 'WAITING' || gameState === 'COUNTDOWN') {
                    const now = Date.now();
                    const elapsed = now - this.startTime;
                    this.lockInProgress = Math.min(elapsed / LOCK_TIME, 1);

                    if (this.lockInProgress >= 1 && !this.isReady) {
                        this.isReady = true;
                        triggerVibrate(20);
                    }
                }

                if (gameState === 'RESULT' && mode === 'group' && this.targetGroupColor) {
                    const resultElapsed = Date.now() - resultStartTime;
                    const transitionProgress = Math.min(resultElapsed / 500, 1);
                    this.currentColor = lerpColor('#FFFFFF', this.targetGroupColor, transitionProgress);
                } else if (mode === 'group') {
                    this.currentColor = '#FFFFFF';
                } else {
                    this.currentColor = this.originalColor;
                }
            }

            draw(ctx) {
                let currentRadius = this.radius;

                // 常駐高頻微動呼吸效果 (只要半徑 > 5px 且未在抬手時生效)
                if (this.radius > 5 && !this.isLifting) {
                    const pulse = Math.sin(Date.now() / 250) * 2.5;
                    currentRadius += pulse;
                }

                // 1. 處理抽籤模式落選者的消失動畫
                if (gameState === 'RESULT' && mode === 'pick' && !this.isWinner) {
                    const elapsed = Date.now() - resultStartTime;
                    if (elapsed >= LOSER_SHRINK_DURATION) {
                        return;
                    } else {
                        const progress = elapsed / LOSER_SHRINK_DURATION;
                        const scale = 1 - easeInCubic(progress);
                        currentRadius *= scale;
                    }
                }

                // 2. 處理全域退出動畫
                if (isGameExiting) {
                    const elapsed = Date.now() - exitStartTime;
                    const progress = Math.min(elapsed / EXIT_ANIMATION_DURATION, 1);
                    const scale = 1 - easeInCubic(progress);
                    currentRadius *= scale;
                }

                if (currentRadius <= 0.5) return;

                ctx.save();

                // 決定基礎透明度 (若正在鬆開縮小，同步平滑淡出)
                let baseAlpha = 1.0;
                if (this.isLifting) {
                    const elapsed = Date.now() - this.liftStartTime;
                    const progress = Math.min(elapsed / LIFT_SHRINK_DURATION, 1);
                    baseAlpha = Math.max(0, 1 - progress);
                }
                ctx.globalAlpha = baseAlpha;

                ctx.beginPath();
                ctx.shadowBlur = 0;
                ctx.shadowColor = 'transparent';

                // 決定基礎顏色 (未就位時灰黑色：pick為#333，group為#555)
                let drawColor = this.currentColor;
                if (gameState !== 'RESULT' && !this.isReady) {
                    if (mode === 'pick') drawColor = '#333';
                    if (mode === 'group') drawColor = '#555';
                } else if (gameState === 'RESULT') {
                    drawColor = this.currentColor;
                }

                ctx.fillStyle = drawColor;
                ctx.arc(this.x, this.y, currentRadius, 0, Math.PI * 2);
                ctx.fill();

                // --- 進度環 (雙層粗環 lineWidth = 8, 半徑 currentRadius + 15) ---
                let strokeBaseColor = this.originalColor;
                if (mode === 'group' && gameState !== 'RESULT') {
                    strokeBaseColor = '#FFFFFF';
                } else if (gameState === 'RESULT') {
                    strokeBaseColor = this.currentColor;
                }

                ctx.strokeStyle = strokeBaseColor; // 永遠只吃原始 Hex / 原色

                let showSpinningRing = true;
                if (gameState === 'RESULT') {
                    if (mode === 'pick' && !this.isWinner) {
                        showSpinningRing = false;
                    }
                }
                if (this.isLifting) {
                    showSpinningRing = false;
                }

                // Layer 1: 就位旋轉圓環 (利用 Canvas 狀態透明度 0.4, 帶常駐旋轉位移)
                if (showSpinningRing && !isGameExiting) {
                    ctx.save();
                    ctx.globalAlpha = baseAlpha * 0.4;
                    ctx.lineWidth = 8;
                    ctx.lineCap = 'round';

                    const spinOffset = (Date.now() / 150) % (Math.PI * 2);
                    const fullCircleAdjustment = this.isReady ? 0.0001 : 0;
                    const currentProgress = this.isReady ? 1 : this.lockInProgress;
                    const endAngle = (Math.PI * 2 * currentProgress) - fullCircleAdjustment;

                    ctx.beginPath();
                    ctx.arc(this.x, this.y, currentRadius + 15, spinOffset, spinOffset + endAngle);
                    ctx.stroke();
                    ctx.restore();
                }

                // Layer 2: 集體倒數圓環 (不透明原色 strokeBaseColor, butt 結尾)
                if (gameState === 'COUNTDOWN' && !this.isLifting) {
                    ctx.lineWidth = 8;
                    ctx.lineCap = 'butt';

                    const spinOffset2 = (Date.now() / 200) % (Math.PI * 2);
                    const startAngle = (-Math.PI / 2) + spinOffset2;
                    const endAngle = startAngle + (Math.PI * 2 * globalProgress);

                    ctx.beginPath();
                    ctx.arc(this.x, this.y, currentRadius + 15, startAngle, endAngle);
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        // --- Core Logic & Lifecycle ---

        // DPR 上限抑制: Math.min(window.devicePixelRatio || 1, 2.0)
        function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 2.0);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', resize);
        resize();

        // 智能 UI 避讓狀態旗標 (DOM 節流)
        let lastUiHidden = false;

        function loop() {
            ctx.clearRect(0, 0, width, height);

            for (const [id, f] of fingers) {
                f.update();
                if (f.isDead) {
                    fingers.delete(id);
                }
            }

            updateGameLogic();

            // 僅在單人中籤 (mode === 'pick' && targetValue === 1) 時繪製特色聚光燈
            if (gameState === 'RESULT' && mode === 'pick' && targetValue === 1) {
                drawSpotlight();
            }

            for (const f of fingers.values()) {
                f.draw(ctx);
            }

            requestAnimationFrame(loop);
        }
        loop();

        // 聚光燈樣式還原 (Canvas 逆向路徑挖洞，直接填入中籤者原色，開場收縮，退場擴散)
        function drawSpotlight() {
            if (!spotlightState.active) return;
            if (mode !== 'pick' || targetValue !== 1) return;

            const targetRadius = spotlightState.radius + 60;
            const maxDimension = Math.max(width, height) * 1.5;
            let currentRadius;
            let currentAlpha = 0.85;

            if (spotlightState.isExiting) {
                const elapsed = Date.now() - spotlightState.exitStartTime;
                const progress = Math.min(elapsed / SPOTLIGHT_EXIT_DURATION, 1);
                const eased = easeOutCubic(progress);
                // 放大退出動畫：聚光燈圓孔從 targetRadius 急速放大到超出螢幕
                currentRadius = targetRadius + (maxDimension - targetRadius) * eased;
                // 背景遮罩同步淡出 (0.85 -> 0)
                currentAlpha = 0.85 * (1 - easeInCubic(progress));

                if (progress >= 1) {
                    spotlightState.active = false;
                    return;
                }
            } else {
                // 開場收縮動畫：從全螢幕外圍收縮到 targetRadius
                const elapsed = Date.now() - resultStartTime;
                const progress = Math.min(elapsed / 600, 1);
                const eased = easeOutCubic(progress);
                currentRadius = maxDimension - (maxDimension - targetRadius) * eased;
                currentAlpha = 0.85 * Math.min(progress * 1.5, 1);
            }

            if (currentAlpha <= 0.005) return;

            ctx.save();
            ctx.beginPath();
            ctx.rect(0, 0, width, height);
            if (currentRadius < 0) currentRadius = 0;

            // 逆向圓弧挖洞
            ctx.arc(spotlightState.x, spotlightState.y, currentRadius, 0, Math.PI * 2, true);
            ctx.fillStyle = spotlightState.color;
            ctx.globalAlpha = currentAlpha;

            ctx.fill();
            ctx.restore();
        }

        function updateGameLogic() {
            // 統計在場手指
            let count = 0;
            let readyCount = 0;
            let allReady = true;

            for (const f of fingers.values()) {
                if (!f.isLifted && !f.isLifting && !f.isDead) {
                    count++;
                    if (f.isReady) {
                        readyCount++;
                    } else {
                        allReady = false;
                    }
                }
            }
            if (count === 0) allReady = false;

            // 只要有 1 個或以上準備好的圓圈，或處於結算狀態，就隱藏 UI (TranslateY)
            const shouldHide = (gameState === 'RESULT' || readyCount > 0);
            if (shouldHide !== lastUiHidden) {
                lastUiHidden = shouldHide;
                uiLayer.classList.toggle('hidden-ui', shouldHide);
            }

            if (gameState === 'RESULT') {
                return;
            }

            const minFingersNeeded = Math.max(2, mode === 'pick' ? targetValue + 1 : targetValue);

            if (count >= minFingersNeeded && allReady) {
                if (gameState === 'WAITING') {
                    gameState = 'COUNTDOWN';
                    globalCountdownStart = Date.now();
                    globalProgress = 0;
                } else if (gameState === 'COUNTDOWN') {
                    const elapsed = Date.now() - globalCountdownStart;
                    globalProgress = elapsed / TOTAL_COUNTDOWN_TIME;

                    if (globalProgress >= 1) {
                        calculateResult();
                    }
                }
            } else {
                if (gameState === 'COUNTDOWN') {
                    gameState = 'WAITING';
                    globalProgress = 0;
                }
            }
        }

        function calculateResult() {
            gameState = 'RESULT';
            resultStartTime = Date.now();
            isGameExiting = false;

            // 1. 所有在場手指全部參與結算判定
            for (const f of fingers.values()) {
                f.isLifted = false;
            }

            const fingerArray = [];
            for (const f of fingers.values()) {
                if (!f.isLifting && !f.isDead) {
                    fingerArray.push(f);
                }
            }

            if (mode === 'pick') {
                // Fisher-Yates 嚴格隨機洗牌
                const shuffled = shuffle(fingerArray);
                const winners = new Set(shuffled.slice(0, targetValue));

                for (const f of fingerArray) {
                    if (winners.has(f)) {
                        f.isWinner = true;
                    } else {
                        f.isLoser = true;
                    }
                }

                // 僅在單人中籤 (targetValue === 1) 時啟動特色聚光燈
                if (targetValue === 1 && winners.size === 1) {
                    const singleWinner = shuffled[0];
                    spotlightState.active = true;
                    spotlightState.x = singleWinner.x;
                    spotlightState.y = singleWinner.y;
                    spotlightState.color = singleWinner.originalColor;
                    spotlightState.radius = singleWinner.targetRadius || 38;
                    spotlightState.isExiting = false;
                    spotlightState.exitStartTime = 0;
                } else {
                    spotlightState.active = false;
                }
            } else if (mode === 'group') {
                spotlightState.active = false;
                const shuffled = shuffle(fingerArray);
                const groupColors = [];
                for (let i = 0; i < targetValue; i++) {
                    const hue = Math.floor((360 / targetValue) * i);
                    groupColors.push(hslToHex(hue, 100, 60));
                }

                for (let index = 0; index < shuffled.length; index++) {
                    const gIndex = index % targetValue;
                    shuffled[index].targetGroupColor = groupColors[gIndex];
                }
            }

            triggerVibrate([100, 50, 100]);

            // 電腦端若未按住滑鼠（全 Shift 釘選情境），結算判定完畢後標記為鬆手並啟動 1.5 秒退場
            if (!isMouseDown) {
                let hasSimulated = false;
                for (const f of fingers.values()) {
                    if (f.id >= 999) {
                        f.isLifted = true;
                        hasSimulated = true;
                    }
                }
                if (hasSimulated) {
                    checkResultEndCondition();
                }
            }
        }

        function handleTouch(e) {
            e.preventDefault();
            const touches = e.changedTouches;

            for (let i = 0; i < touches.length; i++) {
                const t = touches[i];

                if (e.type === 'touchstart') {
                    // 結算狀態、等待退出中或退場動畫期間，不偵測新的觸碰
                    if (gameState === 'RESULT' || isGameExiting) return;

                    fingers.set(t.identifier, new Finger(t.identifier, t.pageX, t.pageY));
                    if (gameState === 'COUNTDOWN') {
                        gameState = 'WAITING';
                        globalProgress = 0;
                    }

                } else if (e.type === 'touchmove') {
                    const f = fingers.get(t.identifier);
                    if (f && !f.isLifted) {
                        if (gameState === 'RESULT') {
                            if (mode === 'pick') {
                                if (f.isWinner) {
                                    f.x = t.pageX;
                                    f.y = t.pageY;
                                    if (targetValue === 1 && spotlightState.active && !spotlightState.isExiting) {
                                        spotlightState.x = t.pageX;
                                        spotlightState.y = t.pageY;
                                    }
                                }
                            } else if (mode === 'group') {
                                f.x = t.pageX;
                                f.y = t.pageY;
                            }
                        } else {
                            f.x = t.pageX;
                            f.y = t.pageY;
                        }
                    }

                } else if (e.type === 'touchend' || e.type === 'touchcancel') {
                    const f = fingers.get(t.identifier);
                    if (f) {
                        if (gameState === 'RESULT') {
                            // 結果狀態下標記鬆手，等待全員鬆手後自然重置
                            f.isLifted = true;
                        } else {
                            f.startLift();
                        }
                    }

                    if (gameState === 'RESULT') {
                        checkResultEndCondition();
                    } else {
                        if (gameState === 'COUNTDOWN') {
                            gameState = 'WAITING';
                            globalProgress = 0;
                        }
                    }
                }
            }
        }

        function checkResultEndCondition() {
            let shouldReset = false;

            if (mode === 'pick') {
                let activeWinners = 0;
                for (const f of fingers.values()) {
                    if (f.isWinner && !f.isLifted) {
                        activeWinners++;
                    }
                }
                if (activeWinners === 0) {
                    shouldReset = true;
                }
            } else if (mode === 'group') {
                let fingersOnScreen = 0;
                for (const f of fingers.values()) {
                    if (!f.isLifted) {
                        fingersOnScreen++;
                    }
                }
                if (fingersOnScreen === 0) {
                    shouldReset = true;
                }
            }

            if (shouldReset) {
                if (!resetTimer) {
                    resetTimer = setTimeout(() => {
                        if (mode === 'pick' && targetValue === 1 && spotlightState.active) {
                            spotlightState.isExiting = true;
                            spotlightState.exitStartTime = Date.now();
                        }
                        startExitSequence();
                    }, RESULT_RESET_DELAY);
                }
            }
        }

        function startExitSequence() {
            isGameExiting = true;
            exitStartTime = Date.now();
            setTimeout(resetGame, EXIT_ANIMATION_DURATION);
        }

        function resetGame() {
            gameState = 'WAITING';
            fingers.clear();
            globalProgress = 0;
            if (resetTimer) {
                clearTimeout(resetTimer);
                resetTimer = null;
            }
            isGameExiting = false;
            spotlightState.active = false;
            spotlightState.isExiting = false;
            uiLayer.classList.remove('hidden-ui');
            lastUiHidden = false;
        }

        // 事件監聽 (Passive: false 嚴密防禦系統手勢)
        const touchOpts = { passive: false };
        canvas.addEventListener('touchstart', handleTouch, touchOpts);
        canvas.addEventListener('touchmove', handleTouch, touchOpts);
        canvas.addEventListener('touchend', handleTouch, touchOpts);
        canvas.addEventListener('touchcancel', handleTouch, touchOpts);

        // 桌面滑鼠測試支援 (支援 Shift+點擊釘選多個模擬手指)
        let isMouseDown = false;
        canvas.addEventListener('mousedown', (e) => {
            // 結算狀態、等待退出中或退場動畫期間，不偵測新的觸碰
            if (gameState === 'RESULT' || isGameExiting) return;

            if (e.shiftKey) {
                const simId = 1000 + fingers.size;
                fingers.set(simId, new Finger(simId, e.pageX, e.pageY));
                return;
            }
            isMouseDown = true;
            fingers.set(999, new Finger(999, e.pageX, e.pageY));
        });

        window.addEventListener('mousemove', (e) => {
            const f = fingers.get(999);
            if (!f) return;

            if (gameState === 'RESULT') {
                if (mode === 'pick' && f.isWinner) {
                    f.x = e.pageX;
                    f.y = e.pageY;
                    if (targetValue === 1 && spotlightState.active && !spotlightState.isExiting) {
                        spotlightState.x = e.pageX;
                        spotlightState.y = e.pageY;
                    }
                } else if (mode === 'group') {
                    f.x = e.pageX;
                    f.y = e.pageY;
                }
            } else if (isMouseDown) {
                f.x = e.pageX;
                f.y = e.pageY;
            }
        });

        window.addEventListener('mouseup', () => {
            const wasMouseDown = isMouseDown;
            isMouseDown = false;

            if (gameState === 'RESULT') {
                // 電腦瀏覽器測試：放開滑鼠時將所有虛擬手指 (id >= 999，包含 Shift 釘選手指) 同步標記為已鬆手
                for (const f of fingers.values()) {
                    if (f.id >= 999) {
                        f.isLifted = true;
                    }
                }
                checkResultEndCondition();
            } else if (wasMouseDown) {
                const f = fingers.get(999);
                if (f) {
                    f.startLift();
                }
                if (gameState === 'COUNTDOWN') {
                    gameState = 'WAITING';
                    globalProgress = 0;
                }
            }
        });

        // 鍵盤輔助: 按 Esc 或 C 鍵快速重置所有手指
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') {
                resetGame();
            }
        });

        // UI 控制項互動
        const modePickBtn = document.getElementById('mode-pick');
        const modeGroupBtn = document.getElementById('mode-group');
        const btnMinus = document.getElementById('counter-minus');
        const btnPlus = document.getElementById('counter-plus');
        const targetCountEl = document.getElementById('target-count');
        const targetLabelEl = document.getElementById('target-label');

        function setMode(newMode) {
            if (mode === newMode) return;
            mode = newMode;

            modePickBtn.classList.toggle('active', mode === 'pick');
            modeGroupBtn.classList.toggle('active', mode === 'group');

            targetValue = mode === 'pick' ? 1 : 2;
            updateUI();
        }

        function adjustCount(delta) {
            const minVal = mode === 'pick' ? 1 : 2;
            const maxVal = 5;
            const next = targetValue + delta;
            if (next >= minVal && next <= maxVal) {
                targetValue = next;
                updateUI();
                triggerVibrate(15);
            }
        }

        function updateUI() {
            const minVal = mode === 'pick' ? 1 : 2;
            const maxVal = 5;

            targetCountEl.innerText = targetValue;
            targetLabelEl.innerText = mode === 'pick' ? '人' : '組';

            btnMinus.classList.toggle('disabled', targetValue <= minVal);
            btnPlus.classList.toggle('disabled', targetValue >= maxVal);

            const minFingers = Math.max(2, mode === 'pick' ? targetValue + 1 : targetValue);
            instructionsText.innerText = `${minFingers} 指以上開始`;
        }

        modePickBtn.addEventListener('click', () => setMode('pick'));
        modeGroupBtn.addEventListener('click', () => setMode('group'));
        btnMinus.addEventListener('click', () => adjustCount(-1));
        btnPlus.addEventListener('click', () => adjustCount(1));
        updateUI();

        // Screen Wake Lock API (防止螢幕休眠)
        let wakeLock = null;
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => {
                        wakeLock = null;
                    });
                } catch (_) { }
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (gameState === 'COUNTDOWN') {
                    gameState = 'WAITING';
                    globalProgress = 0;
                }
            } else {
                requestWakeLock();
            }
        });

        window.addEventListener('touchstart', requestWakeLock, { once: true, passive: true });
        window.addEventListener('click', requestWakeLock, { once: true, passive: true });

        // 觸控手勢防禦：全面阻斷 iOS Safari 多指放大、橡皮筋滾動與長按選單
        document.addEventListener('gesturestart', (e) => e.preventDefault(), touchOpts);
        document.addEventListener('gesturechange', (e) => e.preventDefault(), touchOpts);
        document.addEventListener('gestureend', (e) => e.preventDefault(), touchOpts);
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // 註冊 Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then((registration) => {
                    registration.update();
                }).catch(() => { });
            });
        }
    </script>
</body>

</html>
