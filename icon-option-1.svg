<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181924"/>
      <stop offset="100%" stop-color="#0E0F14"/>
    </linearGradient>
  </defs>

  <!-- Base App Background (iOS/Android Safe Area Friendly) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad1)"/>

  <!-- Subtle Dashed Connection Track (Party / Touch link) -->
  <circle cx="256" cy="275" r="145" fill="none" stroke="#252836" stroke-width="6" stroke-dasharray="10 14"/>

  <!-- Finger 1: Cyan (Waiting / Ready) -->
  <g transform="translate(145, 335)">
    <circle cx="0" cy="0" r="46" fill="#00E5FF"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#00E5FF" stroke-width="6" stroke-opacity="0.35"/>
    <circle cx="0" cy="0" r="16" fill="#FFFFFF" fill-opacity="0.9"/>
  </g>

  <!-- Finger 2: Magenta / Rose (Waiting / Ready) -->
  <g transform="translate(367, 335)">
    <circle cx="0" cy="0" r="46" fill="#FF2A85"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#FF2A85" stroke-width="6" stroke-opacity="0.35"/>
    <circle cx="0" cy="0" r="16" fill="#FFFFFF" fill-opacity="0.9"/>
  </g>

  <!-- Finger 3: Violet (Waiting / Ready) -->
  <g transform="translate(256, 385)">
    <circle cx="0" cy="0" r="34" fill="#7928CA"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#7928CA" stroke-width="5" stroke-opacity="0.35"/>
    <circle cx="0" cy="0" r="12" fill="#FFFFFF" fill-opacity="0.8"/>
  </g>

  <!-- Finger 4: The Winner (Golden Sparkle / Chosen Target) -->
  <g transform="translate(256, 175)">
    <!-- Outer Ripple Waves -->
    <circle cx="0" cy="0" r="88" fill="none" stroke="#FFD000" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="8 6"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="#FFD000" stroke-width="7" stroke-opacity="0.45"/>
    
    <!-- Main Winner Circle -->
    <circle cx="0" cy="0" r="54" fill="#FFC700"/>
    
    <!-- Flat Lucky Star / Sparkle Icon (✦) -->
    <path d="M 0 -30 Q 0 -6 24 0 Q 0 6 0 30 Q 0 6 -24 0 Q 0 -6 0 -30 Z" fill="#12131A"/>
    <circle cx="0" cy="0" r="4" fill="#FFF8D6"/>
  </g>

  <!-- Micro Orbit Deco Points -->
  <circle cx="180" cy="180" r="5" fill="#FFFFFF" fill-opacity="0.3"/>
  <circle cx="332" cy="180" r="5" fill="#FFFFFF" fill-opacity="0.3"/>
</svg>
