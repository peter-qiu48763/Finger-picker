<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C24"/>
      <stop offset="100%" stop-color="#101116"/>
    </linearGradient>

    <!-- 4-Segment Circular Neon Transitions -->
    <!-- Segment 1 (Top to Right: Cyan -> Coral) -->
    <linearGradient id="neonSeg1" x1="0" y1="-145" x2="145" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#FF3366"/>
    </linearGradient>

    <!-- Segment 2 (Right to Bottom: Coral -> Yellow) -->
    <linearGradient id="neonSeg2" x1="145" y1="0" x2="0" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="100%" stop-color="#FFD600"/>
    </linearGradient>

    <!-- Segment 3 (Bottom to Left: Yellow -> Lime Green) -->
    <linearGradient id="neonSeg3" x1="0" y1="145" x2="-145" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD600"/>
      <stop offset="100%" stop-color="#39FF14"/>
    </linearGradient>

    <!-- Segment 4 (Left to Top: Lime Green -> Cyan) -->
    <linearGradient id="neonSeg4" x1="-145" y1="0" x2="0" y2="-145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
  </defs>

  <!-- Base App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad4)"/>

  <!-- Center Grouping & Target Reticle -->
  <g transform="translate(256, 256)">
    <!-- 4-Segment Connected Circular Neon Gradient Ring -->
    <g fill="none" stroke-width="26" stroke-linecap="butt">
      <!-- Arc 1: Cyan to Coral -->
      <path d="M 0 -145 A 145 145 0 0 1 145 0" stroke="url(#neonSeg1)"/>
      <!-- Arc 2: Coral to Yellow -->
      <path d="M 145 0 A 145 145 0 0 1 0 145" stroke="url(#neonSeg2)"/>
      <!-- Arc 3: Yellow to Lime Green -->
      <path d="M 0 145 A 145 145 0 0 1 -145 0" stroke="url(#neonSeg3)"/>
      <!-- Arc 4: Lime Green to Cyan -->
      <path d="M -145 0 A 145 145 0 0 1 0 -145" stroke="url(#neonSeg4)"/>
    </g>

    <!-- Seamless Junction Caps (Prevents any anti-aliasing seam) -->
    <circle cx="0" cy="-145" r="13" fill="#00F0FF"/>
    <circle cx="145" cy="0" r="13" fill="#FF3366"/>
    <circle cx="0" cy="145" r="13" fill="#FFD600"/>
    <circle cx="-145" cy="0" r="13" fill="#39FF14"/>

    <!-- Concentric Target Orbit Ring (Subtle Track) -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#2B2F42" stroke-width="6"/>

    <!-- Center Chosen Touch Point (Target Reticle) -->
    <!-- Outer Countdown Ring Segment -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-dasharray="190 80" stroke-linecap="round"/>
    
    <!-- Main Center Touch Circle -->
    <circle cx="0" cy="0" r="44" fill="#FFFFFF"/>
    
    <!-- Core Accent Dot -->
    <circle cx="0" cy="0" r="18" fill="#151720"/>
    <circle cx="0" cy="0" r="8" fill="#00E5FF"/>
  </g>
</svg>
