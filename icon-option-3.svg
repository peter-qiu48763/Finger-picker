<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171822"/>
      <stop offset="100%" stop-color="#0E0F14"/>
    </linearGradient>
  </defs>

  <!-- Base App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad3)"/>

  <!-- Minimalist Geometric Fingerprint Waves -->
  <g fill="none" stroke-linecap="round">
    <!-- Wave 1 (Outermost subtle ridge) -->
    <path d="M 120 310 A 150 150 0 0 1 392 310" stroke="#252838" stroke-width="12"/>

    <!-- Wave 2 (Middle ridge) -->
    <path d="M 155 295 A 115 115 0 0 1 357 295" stroke="#2D3145" stroke-width="12"/>

    <!-- Wave 3 (Inner ridge) -->
    <path d="M 195 280 A 75 75 0 0 1 317 280" stroke="#363C54" stroke-width="12"/>
  </g>

  <!-- Participant Finger 1 (Cyan / Left) -->
  <g transform="translate(160, 360)">
    <circle cx="0" cy="0" r="38" fill="#00E5FF"/>
    <circle cx="0" cy="0" r="14" fill="#0E0F14"/>
  </g>

  <!-- Participant Finger 2 (Neon Orange / Center-Bottom) -->
  <g transform="translate(256, 385)">
    <circle cx="0" cy="0" r="38" fill="#FF8800"/>
    <circle cx="0" cy="0" r="14" fill="#0E0F14"/>
  </g>

  <!-- Participant Finger 3 (Electric Purple / Right) -->
  <g transform="translate(352, 360)">
    <circle cx="0" cy="0" r="38" fill="#9D00FF"/>
    <circle cx="0" cy="0" r="14" fill="#0E0F14"/>
  </g>

  <!-- Selected Winner Finger (Neon Emerald / Top Center) -->
  <g transform="translate(256, 175)">
    <!-- Pulse Ripple Ring 2 -->
    <circle cx="0" cy="0" r="92" fill="none" stroke="#00FF99" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="12 10"/>
    <!-- Pulse Ripple Ring 1 -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="#00FF99" stroke-width="8" stroke-opacity="0.6"/>
    <!-- Solid Winner Body -->
    <circle cx="0" cy="0" r="50" fill="#00FF99"/>
    <!-- Winner Crown / Diamond Center -->
    <polygon points="0,-22 18,0 0,22 -18,0" fill="#0E0F14"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
  </g>
</svg>
